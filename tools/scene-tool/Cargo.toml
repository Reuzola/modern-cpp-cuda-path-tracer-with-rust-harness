[package]
name = "scene-tool"
version = "1.0.0"
edition = "2024"
description = "Scene validator and golden image harness for the path tracer"
license = "MIT"
# Prevents accidental `cargo publish`; this crate is repo-internal.
publish = false

# Workspace root.
[workspace]
members = []
resolver = "3"

[dependencies]
# Derive CLI parser from types.
clap = { version = "4", features = ["derive"] }

# Reads the engine's 32-bit float EXR output.
exr = { version = "1.73", default-features = false }

# Offline schema validation; default features disabled to block network calls.
jsonschema = { version = "0.46", default-features = false }

# Decodes the engine's 8-bit RGB PNGs and encodes the diff image.
png = "0.17"

# Deserializes scene model matching JSON schema.
serde = { version = "1.0.229", features = ["derive"] }

# JSON backend for serde.
serde_json = "1.0.151"

# Derives Display and Error for custom errors.
thiserror = "2"

# Test-only. Not linked into the shipped binary and not imposed on anything
# that depends on this crate, so a heavier tree here costs nothing at runtime.
[dev-dependencies]
# Self-deleting temp directories for tests.
tempfile = "3"
