[package]
name = "scene-tool"
version = "0.1.0"
edition = "2024"
description = "Scene validator and golden image harness for the path tracer"
license = "MIT"
# Prevents accidental `cargo publish`; this crate is repo-internal.
publish = false

# Workspace root.
[workspace]
members = []
resolver = "3"

[dependencies]
# Derive CLI parser from types.
clap = { version = "4", features = ["derive"] }

# Offline schema validation; default features disabled to block network calls.
jsonschema = { version = "0.46", default-features = false }

# Deserializes scene model matching JSON schema.
serde = { version = "1.0.229", features = ["derive"] }

# JSON backend for serde.
serde_json = "1.0.151"

# Derives Display and Error for custom errors.
thiserror = "2"
