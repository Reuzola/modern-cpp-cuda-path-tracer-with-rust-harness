name: CI

# Trunk-based, no PRs -> push + manual dispatch only.
# workflow_dispatch adds a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN: read-only, this workflow only reads the repo.
permissions:
  contents: read

# Cancel older run on new push instead of running both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: linux-clang (${{ matrix.preset }})

    # Pinned image (not ubuntu-latest) for a fixed Clang/CMake/Ninja version,
    # matching local dev - required for -Werror to be reliable.
    runs-on: ubuntu-24.04

    strategy:
      # One leg's failure must not cancel the others; all results matter.
      fail-fast: false
      matrix:
        include:
          # Debug + -Werror. Tests only: this leg guards the compiler contract.
          - preset: dev
            render: false
          # Optimizer + ThinLTO path, plus one render to prove the shipped
          # binary reads a scene file and produces an image.
          - preset: release
            render: true
          # ASan + UBSan over the same three stages; the render covers the
          # loader -> BVH -> traversal -> writer path the unit tests split up.
          - preset: asan-ubsan
            render: true

    env:
      # Without it UBSan prints the diagnostic but not where it came from.
      # Harmless on the non-sanitized legs.
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # All three presets resolve the same dependency set, so they share one
      # cache slot.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: core

      # Logged so a future warning can be traced to its compiler version.
      - name: Toolchain versions
        run: |
          clang++ --version
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # catch_discover_tests runs the binary at build time, so discovery
      # crashes - including sanitizer reports - fail Build, not Test.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # noTestsAction=error: zero discovered tests fails loudly.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Same scene and settings as the golden manifest entry, written to a
      # scratch path: this is a smoke render, not a reference render.
      - name: Render a scene
        if: matrix.render
        run: |
          ./build/${{ matrix.preset }}/pathtracer scenes/cornell_box.json \
            --width 200 --height 200 --spp 16 \
            --format png --output "${RUNNER_TEMP}/cornell_box.png" \
            --log-level warning

  tidy:
    name: clang-tidy

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # clang-tidy-18 and run-clang-tidy-18 are not in the runner image, and
      # the viewer's vcpkg ports need the X11 and GL development headers.
      - name: Install the analyser and the viewer's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 clang-tools-18 \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev

      # Separate slot: this is the only job that installs the viewer feature.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: viewer

      - name: Toolchain versions
        run: clang-tidy-18 --version

      # Configure only. clang-tidy reads compile_commands.json and the
      # dependency headers; nothing here needs a compiled artefact.
      - name: Configure
        run: cmake --preset dev-viewer

      # dev-viewer, not dev: the viewer translation units are absent from the
      # dev compilation database and would go unanalysed.
      # -warnings-as-errors is set here rather than in .clang-tidy, so the
      # gate lives in CI and the editor stays usable.
      - name: Run clang-tidy
        run: |
          run-clang-tidy-18 \
            -p build/dev-viewer \
            -clang-tidy-binary clang-tidy-18 \
            -j "$(nproc)" \
            -quiet \
            -warnings-as-errors='*'

  scene-tool:
    name: rust (scene-tool)

    # Same pinned image as the C++ jobs, same reason.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: tools/scene-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # Logged so a future lint can be traced to its toolchain version.
      - name: Toolchain versions
        run: |
          cargo --version
          cargo clippy --version

      # --locked fails if Cargo.lock would change, since it's committed.
      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Clippy runs last: a job stops at first failure, so lint issues
      # shouldn't hide test failures.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  render-regression:
    name: render regression

    runs-on: ubuntu-24.04

    # Runs renderer and tool together for an isolated status check.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: core

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # Standard release, never release-native: FMA changes the arithmetic
      # and the references were produced without it.
      - name: Build the renderer
        run: |
          cmake --preset release
          cmake --build --preset release

      # Release build required for loop performance.
      - name: Build scene-tool
        run: cargo build --locked --release
        working-directory: tools/scene-tool

      # Validate structural and semantic scene integrity.
      - name: Validate the scene files
        run: |
          for scene in scenes/*.json; do
            echo "==> ${scene}"
            tools/scene-tool/target/release/scene-tool validate "${scene}"
          done

      # Render to a temp path without touching the references.
      - name: Render the golden scenes
        run: scripts/render-goldens.sh "${RUNNER_TEMP}/actual"

      # Compare outputs; run the full loop before failing.
      - name: Compare against the golden set
        run: |
          status=0
          for actual in "${RUNNER_TEMP}"/actual/*.png; do
            name=$(basename "${actual}")
            echo "==> ${name}"
            tools/scene-tool/target/release/scene-tool compare \
              "tests/golden/${name}" "${actual}" \
              --threshold "${THRESHOLD}" \
              --diff "${RUNNER_TEMP}/diff/${name}" || status=1
          done
          exit "${status}"
        env:
          # Strict bit-identical match threshold.
          THRESHOLD: "0.0"

      # Upload diffs on job failure.
      - name: Upload difference images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: ${{ runner.temp }}/diff
          if-no-files-found: ignore
